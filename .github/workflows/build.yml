name: Build & Package Application

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as a GitHub Release'
        type: boolean
        default: false
      runner:
        description: 'Runner environment'
        type: choice
        options:
          - windows-11-arm
          - windows-latest
        default: windows-11-arm
      target_arch:
        description: 'Tauri build target architecture'
        type: choice
        options:
          - aarch64-pc-windows-msvc
          - x86_64-pc-windows-msvc
        default: aarch64-pc-windows-msvc
      build_id:
        description: 'AOSP Cuttlefish build ID'
        type: string
        default: '15357239'

permissions:
  contents: write

jobs:
  build:
    name: Build & Package (Windows ARM64)
    runs-on: ${{ inputs.runner || 'windows-11-arm' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git and checkout required submodules
        shell: pwsh
        run: |
          git config --global core.protectNTFS false
          Write-Host "Fetching required submodules with depth 1..."
          git submodule update --init --depth 1 tools/qemu-gfxstream/qemu tools/qemu-gfxstream/rutabaga_gfx tools/qemu-gfxstream/gfxstream
          Write-Host "Disk space available on runner:"
          Get-PSDrive C | Select-Object Used, Free, @{Name="FreeGB";Expression={[math]::Round($_.Free/1GB,2)}}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install meson ninja

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc,x86_64-pc-windows-msvc

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Node dependencies
        run: npm ci

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'amd64_arm64' }}

      - name: Setup MSYS2 & ARM64 build toolchain
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: CLANGARM64
          path-type: inherit
          update: true
          cache: true
          install: >-
            diffutils
            mingw-w64-clang-aarch64-diffutils
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-meson
            mingw-w64-clang-aarch64-ninja
            mingw-w64-clang-aarch64-pkgconf
            mingw-w64-clang-aarch64-glib2
            mingw-w64-clang-aarch64-pixman
            mingw-w64-clang-aarch64-dtc
            mingw-w64-clang-aarch64-capstone
            mingw-w64-clang-aarch64-libslirp
            mingw-w64-clang-aarch64-zstd
            mingw-w64-clang-aarch64-SDL2
            mingw-w64-clang-aarch64-qemu-common

      - name: Export MSYS2 environment
        shell: pwsh
        run: |
          $msys = "${{ steps.msys2.outputs.msys2-location }}"
          if (-not $msys -or -not (Test-Path $msys)) {
            $cands = @("C:\msys64", "$env:RUNNER_TEMP\msys64", "D:\msys64", "$env:TEMP\msys64")
            $msys = ($cands | Where-Object { Test-Path $_ } | Select-Object -First 1)
          }
          Write-Host "Detected MSYS2 root at: $msys"
          "MSYS2_ROOT=$msys" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $clang = Join-Path $msys "clangarm64\bin"
          $usr = Join-Path $msys "usr\bin"
          "CLANGARM64_BIN=$clang" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MSYS2_USR_BIN=$usr" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $clang | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Cache custom-patched QEMU build
        uses: actions/cache@v4
        id: qemu-cache
        with:
          path: |
            tools/qemu-gfxstream/qemu/build/qemu-system-aarch64.exe
            tools/qemu-gfxstream/qemu/build/*.dll
            tools/qemu-gfxstream/rutabaga-prefix
          key: qemu-custom-${{ hashFiles('tools/qemu-gfxstream/patches/**', 'tools/apply_patches.ps1', 'tools/build_custom_qemu.ps1') }}

      - name: Build custom-patched QEMU
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          pwsh -ExecutionPolicy Bypass -File tools/build_custom_qemu.ps1

      - name: Cache AOSP Cuttlefish Image Archive
        uses: actions/cache@v4
        id: aosp-cache
        with:
          path: aosp_cf_arm64_only_phone-img/*.zip
          key: aosp-cf-arm64-${{ inputs.build_id || '15357239' }}

      - name: Stage complete bundle resources
        shell: pwsh
        run: |
          $buildId = if ("${{ inputs.build_id }}" -ne "") { "${{ inputs.build_id }}" } else { "15357239" }
          Write-Host "Staging application resources with custom QEMU and AOSP Build ID: $buildId"
          pwsh -ExecutionPolicy Bypass -File tools/stage_bundle.ps1 -AutoDownload -BuildId $buildId

      - name: Type check and build frontend
        run: npm run build

      - name: Build Tauri application and installer
        shell: pwsh
        run: |
          $target = if ("${{ inputs.target_arch }}" -ne "") { "${{ inputs.target_arch }}" } else { "aarch64-pc-windows-msvc" }
          Write-Host "Building Tauri bundle for target: $target"
          npx tauri build --target $target
        env:
          CI: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QArmDroid-Windows-Installer
          path: |
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/tauri-app.exe
            src-tauri/target/**/release/QArmDroid.exe

      - name: Publish to GitHub Release
        if: (startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/tauri-app.exe
            src-tauri/target/**/release/QArmDroid.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

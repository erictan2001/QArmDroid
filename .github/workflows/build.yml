name: Build & Package Application

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as a GitHub Release'
        type: boolean
        default: false
      target_arch:
        description: 'Tauri build target architecture'
        type: choice
        options:
          - aarch64-pc-windows-msvc
          - x86_64-pc-windows-msvc
        default: aarch64-pc-windows-msvc
      build_id:
        description: 'AOSP Cuttlefish build ID'
        type: string
        default: '15357239'

permissions:
  contents: write

jobs:
  build:
    name: Build & Package (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc,x86_64-pc-windows-msvc

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Node dependencies
        run: npm ci

      - name: Setup MSYS2 & ARM64 QEMU
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          cache: true
          install: >-
            mingw-w64-clang-aarch64-qemu

      - name: Cache AOSP Cuttlefish Image Archive
        uses: actions/cache@v4
        id: aosp-cache
        with:
          path: aosp_cf_arm64_only_phone-img/*.zip
          key: aosp-cf-arm64-${{ inputs.build_id || '15357239' }}

      - name: Stage complete bundle resources
        shell: pwsh
        run: |
          $buildId = if ("${{ inputs.build_id }}" -ne "") { "${{ inputs.build_id }}" } else { "15357239" }
          Write-Host "Staging application resources with AOSP Build ID: $buildId"
          powershell -ExecutionPolicy Bypass -File tools/stage_bundle.ps1 -AutoDownload -BuildId $buildId

      - name: Type check and build frontend
        run: npm run build

      - name: Build Tauri application and installer
        shell: pwsh
        run: |
          $target = if ("${{ inputs.target_arch }}" -ne "") { "${{ inputs.target_arch }}" } else { "aarch64-pc-windows-msvc" }
          Write-Host "Building Tauri bundle for target: $target"
          npx tauri build --target $target
        env:
          CI: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QArmDroid-Windows-Installer
          path: |
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/tauri-app.exe
            src-tauri/target/**/release/QArmDroid.exe

      - name: Publish to GitHub Release
        if: (startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/tauri-app.exe
            src-tauri/target/**/release/QArmDroid.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
